# autotr default configuration.
# Copy to config/local.yaml and pass `--config config/local.yaml` to override values.
# All prices/amounts in USDT, all times in UTC.

account:
  starting_balance: 100.0

exchange:
  taker_fee: 0.0005          # 0.05% — confirm your Binance VIP tier / BNB discount
  maker_fee: 0.0002          # 0.02%
  slippage_bps: 2.0          # adverse slippage on market & stop fills (1 bp = 0.01%)
  leverage: 5                # isolated margin
  maintenance_margin_rate: 0.01   # conservative tier-1 MMR used for liquidation price
  default_funding_rate: 0.0001    # used when historical funding data is unavailable (per 8h)

data:
  dir: data
  interval: 1m

universe:
  # Backtest universe (live mode discovers symbols from Binance instead).
  symbols: [
    BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, BNBUSDT, ADAUSDT, AVAXUSDT,
    LINKUSDT, SUIUSDT, LTCUSDT, DOTUSDT, NEARUSDT, APTUSDT, ARBUSDT, OPUSDT,
    INJUSDT, TIAUSDT, SEIUSDT, WIFUSDT, 1000PEPEUSDT, 1000BONKUSDT, ORDIUSDT,
    FETUSDT, RENDERUSDT, WLDUSDT, TRXUSDT, BCHUSDT, FILUSDT, ATOMUSDT, ENAUSDT,
    TAOUSDT, HYPEUSDT, TRUMPUSDT,
  ]
  live_candidates: 40        # live: top-N symbols by 24h volume to watch

scanner:
  rank_by: change_24h              # change_24h (biggest 24h movers) | volatility (5m ATR%)
  min_quote_volume_24h: 50000000   # $50M
  atr_period_bars: 48              # 5m bars → last 4h (volatility ranking)
  top_n: 8
  rescan_minutes: 15

strategy:
  name: confluence                 # confluence (manual method) | scalper (old 1m strategy, see config/scalper.yaml)
  entry_tf_minutes: 5              # signals, RSI and ladder on 5m candles
  structure_tf_minutes: 60         # S/R zones, trendlines, channels, Elliott waves on 1h candles
  structure_history_bars: 240      # 10 days of 1h candles

  # RSI gate: oversold/overbought within the last `rsi_lookback` entry bars
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  rsi_extreme_low: 20
  rsi_extreme_high: 80
  rsi_lookback: 3

  # Score: a trade needs min_score points (RSI alone is at most 2)
  min_score: 3.0
  w_rsi: 1.0
  w_rsi_extreme: 0.5
  w_rsi_turn: 0.5
  w_zone: 1.0
  w_zone_strong: 0.5               # zone touched >= strong_zone_touches times
  w_channel: 1.0
  w_trendline: 1.0
  w_elliott: 1.5
  use_zones: true
  use_channels: true
  use_trendlines: true
  use_elliott: true
  use_ladder: true

  # Structure detection (1h)
  atr_period: 14
  pivot_left: 3
  pivot_right: 3
  zone_tolerance_atr: 0.25         # cluster pivots within this × ATR
  zone_min_touches: 2
  strong_zone_touches: 3
  trendline_lookback_pivots: 6
  trendline_break_tolerance_atr: 0.1
  channel_lookback_pivots: 12
  elliott_strict_overlap: true     # wave 4 may not enter wave-1 territory
  elliott_max_age_bars: 12         # fade only within 12 structure bars of the wave-5 extreme
  proximity_atr: 0.3               # "at the level" = within this × structure ATR
  touch_lookback_bars: 3           # entry bars in which the touch may have happened

  # Ladder, stop, target
  ladder_weights: [0.2, 0.3, 0.5]  # nearest rung first; biggest order closest to the level
  ladder_expiry_bars: 6            # unfilled rungs cancel after 6 entry bars (30 min)
  stop_buffer_atr: 0.5             # stop beyond the structure by this × entry ATR
  min_stop_pct: 0.0015
  max_stop_pct: 0.04
  min_reward_risk_after_fees: 1.5
  time_stop_minutes: 720           # close after 12h if neither stop nor target hit
  cooldown_minutes: 30

  # Used by the scalper strategy only
  take_profit_r: 2.0
  trend_filter: false
  trend_ema_period: 50
  trend_slope_bars: 6
  min_stop_atr5: 0.0
  min_confluence: 1

risk:
  risk_per_trade: 0.02             # 2% of equity
  max_margin_per_position: 0.5     # fraction of equity usable as margin by one position
  max_positions: 2
  daily_loss_limit: 0.06           # stop for the UTC day after -6%
  max_trades_per_day: 40

live:
  db_path: data/live.db            # paper account + trade log (delete or use --reset to start over)
  candidate_refresh_hours: 6       # re-pick the top-volume watch list (also renews the WS connection)
  warmup_bars: 1500                # 1m history fetched per symbol at start-up (~25h)
  rest_url: https://fapi.binance.com
  ws_url: wss://fstream.binance.com   # combined streams at {ws_url}/stream?streams=...
  stream_timeout_s: 150            # reconnect if no candle arrives for this long
