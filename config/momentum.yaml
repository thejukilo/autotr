# Best strategy from the Nov 2026 strategy search (see docs/RESEARCH_LOG.md): cross-sectional 7-day momentum,
# long top 2 / short bottom 2 every 4h, 3 ATR stop + 3 ATR trailing stop. Positive in all 6 test windows incl. holdout.
# Backtest:            uv run autotr backtest --config config/momentum.yaml
# Live paper trading:  uv run autotr live --config config/momentum.yaml
universe:
  live_use_symbols: true     # trade the same 34 coins as in the research, ranked against each other
live:
  db_path: data/live_momentum.db   # separate paper account from the default strategy
scanner:
  rank_by: volatility
  top_n: 34
  min_quote_volume_24h: 20000000
risk:
  risk_per_trade: 0.01
  max_positions: 4
  max_trades_per_day: 20
strategy:
  name: xs_momentum_trail
  entry_tf_minutes: 240
  structure_tf_minutes: 240
  structure_history_bars: 80
  time_stop_minutes: 14400
  cooldown_minutes: 1440
  params: {lookback: 42, k: 2, ema: 1, stop_atr: 3.0, trail_atr: 3.0}
