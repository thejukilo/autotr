# REAL-MONEY sibling of scalp_best.yaml — the SAME strategy (scalp_ignition, ~8 trades/day), with
# safety rails set for live funds instead of a paper backtest. Run with:
#     autotr live --real -c config/scalp_real.yaml
# Keys come from the environment (BINANCE_API_KEY / BINANCE_API_SECRET); never put them here.
#
# Differences from config/scalp_best.yaml (the SIGNAL + geometry are identical, so the edge is unchanged):
#   * risk.daily_loss_limit: 0.9 -> 0.15   — a REAL circuit breaker. The paper config halts only at a
#       90% loss (effectively never); this stops trading for the UTC day after a 15% drawdown.
#   * exchange.leverage: 10 -> 2           — liquidation now sits ~50% from entry instead of ~10%.
#       Leverage does NOT change position SIZE (that is set by risk ÷ stop distance, not leverage) or
#       the backtested P&L; it only governs how far liquidation is and how much total margin the wallet
#       can carry. At 2x the $100 wallet backs at most ~$200 of total notional across all positions —
#       so fewer trades stack at once, which is the real cap you asked for.
#   * live.testnet: false                  — real Binance. Set true to rehearse on testnet first.
#   * live.db_path: data/real.db           — its own account db, separate from the paper history.
#   * live.max_notional_usd: 0             — off (risk-sizing governs). Set e.g. 60 for a hard per-trade cap.
#
# Laddering is ON (rungs: 3, market: false): the entry rests 3 post-only LIMIT rungs and the position
# opens as they fill, at the real average — matching the backtest. (The old real path collapsed this to
# one market order; fixed in sim/binance_exchange.py.)
#
# Stops are still scalp-tight (min 0.4%, max 1.5%) with a +2% take-profit — the geometry the backtest
# validated. Widening the stop also means re-tuning the take-profit/trail (or reward:risk goes < 1), so
# it is a strategy change to BACKTEST, not a number to guess on live funds. See notes below the params.
# risk.confidence_sizing scales risk 0.5%–2% with signal conviction; set it false for flat 0.25% risk.
universe:
  source: movers
  live_use_symbols: false
  live_candidates: 150
research: {windows: scalp}
exchange: {taker_fee: 0.0005, maker_fee: 0.0002, slippage_bps: 5.0, leverage: 2}
scanner: {rank_by: change_24h, top_n: 20, min_quote_volume_24h: 20000000, rescan_minutes: 15}
risk: {risk_per_trade: 0.0025, max_positions: 8, max_trades_per_day: 1000, daily_loss_limit: 0.15,
       confidence_sizing: true, conf_risk_min: 0.005, conf_risk_max: 0.02}
strategy:
  name: scalp_ignition
  entry_tf_minutes: 5
  structure_tf_minutes: 15
  structure_history_bars: 96
  entry_history_bars: 12
  time_stop_minutes: 60
  cooldown_minutes: 3
  ladder_expiry_bars: 3
  params: {ret_n: 2, min_ret: 0.03, vol_mult: 4.0, min_change: 0.08, min_bars: 10, r1: 0.3, r2: 1.5, rungs: 3, weights: [0.2, 0.3, 0.5], stop_atr: 1.0, min_stop: 0.004, max_stop: 0.015, trail: 2.0, trail_after_r: 1.0, take_pct: 0.02, max_per_day: 200, longs: true, shorts: true, skip_hours: [], market: false}
live:
  db_path: data/real.db
  testnet: false
  dry_run: false
  max_notional_usd: 0

# --- Notes on "wider stops" ----------------------------------------------------------------------
# The stop lives in params above: min_stop / max_stop (fraction from the average entry) and stop_atr.
# To make stops "less close" you raise min_stop/max_stop — BUT take_pct (the +2% target) and the trail
# are tuned to today's 0.4–1.5% stop. If you widen the stop past the target, reward:risk drops below 1
# and the +1R trail never arms (the target fires first). So a wider-stop variant must move together:
#   e.g. min_stop 0.008, max_stop 0.025, take_pct 0.035, trail_after_r 1.0  — and be re-backtested
#   (autotr backtest -c <copy>.yaml) to confirm it still has an edge BEFORE risking funds.
# Laddering already helps the "entry/exit touch instantly" problem on its own: the position only opens
# on a pullback into the limit rungs (a better price), instead of chasing with a market order.
