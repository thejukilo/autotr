# Scalping on the day's top movers: "ignition" long (config/research/scalp/ignition_mkt_r2.yaml).
#
# *** UNVALIDATED: THIS STRATEGY FAILED ITS HOLDOUT. ***
# Pre-registered finalist #1 of the Nov 2026 scalping search (docs/SCALP_RESEARCH_LOG.md). It was positive in
# all 4 research/validation windows but lost in both locked holdout windows (SH1 -15.7% PF 0.49,
# SH2 -20.6% PF 0.31, avg R -0.40). No scalping config passed. Run it on paper only, to watch the
# signal forward, never with real money. It was chosen as the pre-registered #1, not by holdout results.
#
# Idea: a coin that is already up >= 12% today makes a fresh 1h impulse (>= +6% on 12 x 5m bars with
# >= 4x the usual volume): buy at market on the 5m close, stop 2 ATR(5m) below the -1 ATR rung
# (>= 2.5% away), trail 3 ATR(5m) once +1R, no target, 10h time stop, 1 entry per coin per UTC day,
# longs only, no signals 18-24 UTC.
#
# Replay check:        uv run autotr live --replay --config config/scalp.yaml --start 2026-11-05 --end 2026-11-06
# Live paper trading:  uv run autotr live --config config/scalp.yaml
# Web dashboard:       uv run autotr web --config config/scalp.yaml
universe:
  source: movers            # backtests / replays: each day's top movers (autotr download-movers)
  live_use_symbols: false   # live: scan the market, not a fixed coin list
  live_candidates: 150      # live: the 150 highest-volume USDT perps, then ranked by 24h change (small-cap movers)
live:
  db_path: data/live_scalp.db   # its own paper account
research: {windows: scalp}
exchange: {taker_fee: 0.0005, maker_fee: 0.0002, slippage_bps: 5.0}
scanner: {rank_by: change_24h, top_n: 8, min_quote_volume_24h: 50000000, rescan_minutes: 15}
risk: {risk_per_trade: 0.01, max_positions: 3, max_trades_per_day: 40, daily_loss_limit: 0.06}
strategy:
  name: scalp_ignition
  entry_tf_minutes: 5
  structure_tf_minutes: 15
  structure_history_bars: 96
  entry_history_bars: 288
  time_stop_minutes: 600
  cooldown_minutes: 180
  ladder_expiry_bars: 3
  params: {ret_n: 12, min_ret: 0.06, vol_mult: 4.0, min_change: 0.12, r1: 0.5, r2: 1.0, stop_atr: 2.0, min_stop: 0.025, trail: 3.0, trail_after_r: 1.0, max_per_day: 1, longs: true, shorts: false, skip_hours: [18, 19, 20, 21, 22, 23], market: true}
