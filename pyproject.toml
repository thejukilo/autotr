[project]
name = "autotr"
version = "0.1.0"
description = "Simulated scalping bot for Binance USDT-M perpetual futures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "httpx>=0.27",
    "websockets>=12",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "matplotlib>=3.8",
]

[project.scripts]
autotr = "autotr.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
